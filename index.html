  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  .search-wrap svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%);

  .search-input {
    width: 100%; background: #0a0f1a; border: 1px solid #1e293b;

  }
  .search-input:focus { border-color: #3b82f6; }
  .search-input::placeholder { color: #334155; }
  .search-clear {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #475569; cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0;
  }
  .search-clear:hover { color: #94a3b8; }

  .ch-item:hover { background: rgba(255,255,255,.04); }

  .sticky-head th { position: sticky; top: 0; z-index: 2; }

  .pill-btn {
    padding: 3px 10px; border-radius: 20px; border: 1px solid #1e293b;
    background: transparent; color: #64748b; font-size: 11px; cursor: pointer;
    white-space: nowrap; transition: all .12s; line-height: 1.6;
  }
  .pill-btn:hover { border-color: #334155; color: #94a3b8; }

  .icon-btn {
    background: #1e293b; border: 1px solid #334155; border-radius: 6px;
    color: #64748b; font-size: 12px; padding: 4px 10px; cursor: pointer;
    transition: all .12s; white-space: nowrap;
  }
  .icon-btn:hover { border-color: #475569; color: #94a3b8; }
  .icon-btn.active { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }

  .agent-row:hover { filter: brightness(1.25); }

  .sidebar { width: 252px; min-width: 200px; }
  .main-content { flex: 1; }
  @media (max-width: 720px) {

<script type="text/babel">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

// ---------------------------------------------------------------------------
// Colour scale  red → amber → green
// ---------------------------------------------------------------------------
function scoreColor(value, min, max, higherIsBetter) {
  if (value == null || min === max) return null;
  const t = (value - min) / (max - min);
  const norm = higherIsBetter ? t : 1 - t;
  const stops = [
    [0.00, [185,  28,  28]],
    [0.25, [239,  68,  68]],
    [0.50, [245, 158,  11]],
    [0.75, [ 34, 197,  94]],
    [1.00, [ 21, 128,  61]],
  ];
  let lo = stops[0], hi = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (norm >= stops[i][0] && norm <= stops[i+1][0]) { lo = stops[i]; hi = stops[i+1]; break; }
  }
  const f = (norm - lo[0]) / ((hi[0] - lo[0]) || 1);
  const r = Math.round(lo[1][0] + f*(hi[1][0]-lo[1][0]));
  const g = Math.round(lo[1][1] + f*(hi[1][1]-lo[1][1]));
  const b = Math.round(lo[1][2] + f*(hi[1][2]-lo[1][2]));
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return { bg: `rgb(${r},${g},${b})`, fg: lum > 0.55 ? '#0f172a' : '#fff' };
}

// ---------------------------------------------------------------------------
// Sidebar
// ---------------------------------------------------------------------------
function Sidebar({ grouped, allChallenges, selectedId, onSelect, query, setQuery }) {
  const [expanded, setExpanded] = useState(() => {
    const sel = allChallenges.find(c => c.id === selectedId);
    return new Set(sel ? [sel.challenge] : []);
  });

  // Expand group when selectedId changes externally (e.g. prompt tabs)
  useEffect(() => {
    const sel = allChallenges.find(c => c.id === selectedId);
    if (sel) setExpanded(prev => prev.has(sel.challenge) ? prev : new Set([...prev, sel.challenge]));
  }, [selectedId]);

  // Expand all matching groups while searching
  useEffect(() => {
    if (query) setExpanded(new Set([...grouped.keys()]));
  }, [query, grouped]);

  const toggle = useCallback(grp => {
    setExpanded(prev => {
      const next = new Set(prev);
      next.has(grp) ? next.delete(grp) : next.add(grp);
      return next;
    });
  }, []);

  // Flat ordered list of visible ids for keyboard nav
  const flatIds = useMemo(() => {
    const ids = [];
    for (const [grp, chs] of grouped) {
      if (expanded.has(grp)) for (const c of chs) ids.push(c.id);
    }
    return ids;
  }, [grouped, expanded]);

  const handleKeyDown = useCallback(e => {
    const idx = flatIds.indexOf(selectedId);
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (idx < flatIds.length - 1) onSelect(flatIds[idx + 1]);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (idx > 0) onSelect(flatIds[idx - 1]);
    } else if (e.key === 'Escape') {
      setQuery('');
    }
  }, [flatIds, selectedId, onSelect, setQuery]);

  return (
    <div
      className="sidebar"
      onKeyDown={handleKeyDown}
      tabIndex={0}
      style={{ background: '#111827', borderRight: '1px solid #1a2540',
               display: 'flex', flexDirection: 'column', height: '100%', outline: 'none' }}
    >
      {/* Search */}
      <div style={{ padding: '10px 10px 8px', borderBottom: '1px solid #1a2540', flexShrink: 0 }}>
        <div className="search-wrap">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fillRule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clipRule="evenodd"/>
          </svg>
          <input
            className="search-input"
            placeholder="Filter challenges…"
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
          {query && <button className="search-clear" onClick={() => setQuery('')}>×</button>}
        </div>
        <div style={{ marginTop: 5, fontSize: 10, color: '#1e3a5f', paddingLeft: 2 }}>
          ↑↓ navigate · Esc clear
        </div>
      </div>

      {/* Groups */}
      <div style={{ overflowY: 'auto', flex: 1 }}>
        {grouped.size === 0 && (
          <div style={{ padding: '20px 14px', fontSize: 12, color: '#334155', textAlign: 'center' }}>
            No matches
          </div>
        )}
        {[...grouped.entries()].map(([grp, chs]) => {
          const isOpen = expanded.has(grp);
          const totalScored = chs.reduce((s, c) => s + c.agents.reduce((s2, a) => s2 + a.n_scored, 0), 0);
          const hasSelected = chs.some(c => c.id === selectedId);
          return (
            <div key={grp}>
              <div
                className="grp-head"
                onClick={() => toggle(grp)}
                style={{ background: hasSelected && !isOpen ? '#0d1f3c' : undefined }}
              >
                <span style={{ fontSize: 13, fontWeight: 600, color: hasSelected ? '#cbd5e1' : '#64748b' }}>
                  {grp}
                </span>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 10, color: '#1e3a5f',
                                 background: '#0d1624', borderRadius: 3, padding: '1px 5px' }}>
                    {chs.length}
                  </span>
                  <svg style={{ width: 11, height: 11, color: '#334155', flexShrink: 0,
                                transform: isOpen ? 'rotate(90deg)' : 'none',
                                transition: 'transform .15s' }}
                       viewBox="0 0 20 20" fill="currentColor">
                    <path fillRule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clipRule="evenodd"/>
                  </svg>
                </div>
              </div>

              {isOpen && chs.map(c => {
                const active = c.id === selectedId;
                const n = c.agents.reduce((s, a) => s + a.n_scored, 0);
                return (
                  <div
                    key={c.id}
                    className="ch-item"
                    onClick={() => onSelect(c.id)}
                    style={{
                      borderLeft: `2px solid ${active ? '#3b82f6' : 'transparent'}`,
                      background: active ? '#0d1f3c' : undefined,
                    }}
                  >
                    <span style={{ fontSize: 12, color: active ? '#e2e8f0' : '#475569',
                                   fontWeight: active ? 600 : 400 }}>
                      {c.prompt}
                    </span>
                    <span style={{ fontSize: 10, color: active ? '#1e40af' : '#1e293b',
                                   background: active ? '#1e3a5f' : '#0d1624',
                                   borderRadius: 3, padding: '1px 5px', flexShrink: 0 }}>
                      {n}
                    </span>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Prompt variant tabs
// ---------------------------------------------------------------------------
function PromptTabs({ siblings, selectedId, onSelect }) {
  if (siblings.length <= 1) return null;
  const VARIANT_COLOR = { guided: '#3b82f6', paper: '#8b5cf6', hard: '#ef4444' };
  const getVariant = prompt => {
    if (/_hard$/.test(prompt)) return 'hard';
    if (/paper/.test(prompt)) return 'paper';
    return 'guided';
  };
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginBottom: 18 }}>
      {siblings.map(c => {
        const active = c.id === selectedId;
        const variant = getVariant(c.prompt);
        const col = VARIANT_COLOR[variant];
        return (
          <button
            key={c.id}
            className="pill-btn"
            onClick={() => onSelect(c.id)}
            style={active ? { borderColor: col, background: col + '22', color: col, fontWeight: 600 } : {}}
          >
            {c.prompt}
          </button>
        );
      })}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Agent table
// ---------------------------------------------------------------------------
function AgentTable({ challenge }) {
  const { agents, metric_label, higher_is_better } = challenge;
  const [sortBy, setSortBy] = useState('rank');
  const [showRuns, setShowRuns] = useState(false);

  // Reset run visibility when challenge changes
  useEffect(() => { setShowRuns(false); setSortBy('rank'); }, [challenge.id]);

  const maxRuns = agents.reduce((m, a) => Math.max(m, a.runs.length), 0);

  const allVals   = agents.flatMap(a => a.runs.map(r => r.value)).filter(v => v != null);
  const minV = allVals.length ? Math.min(...allVals) : 0;
  const maxV = allVals.length ? Math.max(...allVals) : 1;
  const meanVals  = agents.map(a => a.mean).filter(v => v != null);
  const meanMin   = meanVals.length ? Math.min(...meanVals) : 0;
  const meanMax   = meanVals.length ? Math.max(...meanVals) : 1;

  const sorted = useMemo(() => {
    const arr = [...agents];
    if (sortBy === 'rank' || sortBy === 'mean') {
      arr.sort((a, b) => {
        if (a.mean == null && b.mean == null) return 0;
        if (a.mean == null) return 1;
        if (b.mean == null) return -1;
        return higher_is_better ? b.mean - a.mean : a.mean - b.mean;
      });
    } else if (sortBy === 'agent') {
      arr.sort((a, b) => a.agent.localeCompare(b.agent));
    } else if (sortBy === 'nscored') {
      arr.sort((a, b) => b.n_scored - a.n_scored);
    }
    return arr;
  }, [agents, sortBy, higher_is_better]);

  const fmt = v => v == null ? '—' : Number(v).toFixed(4);

  const TH = ({ label, col, align }) => (
    <th
      onClick={() => setSortBy(col)}
      style={{
        padding: '8px 12px', textAlign: align || 'left', fontSize: 11, fontWeight: 600,
        color: sortBy === col ? '#93c5fd' : '#334155', cursor: 'pointer', whiteSpace: 'nowrap',
        background: '#0d1624', borderBottom: '1px solid #1a2540', userSelect: 'none',
      }}
    >
      {label}{sortBy === col ? ' ↓' : ''}
    </th>
  );

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
        <span style={{ fontSize: 12, color: '#334155' }}>
          {metric_label} · {higher_is_better ? '↑ higher' : '↓ lower'}
        </span>
        <button
          className={`icon-btn${showRuns ? ' active' : ''}`}
          onClick={() => setShowRuns(v => !v)}
        >
          {showRuns ? 'Hide runs' : `Show ${maxRuns} run columns`}
        </button>
      </div>

      <div style={{ overflowX: 'auto', borderRadius: 8, border: '1px solid #1a2540' }}>
        <table className="sticky-head" style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
          <thead>
            <tr>
              <TH label="#"                      col="rank"    />
              <TH label="Agent"                  col="agent"   />
              <TH label={`Mean ${metric_label}`} col="mean"    />
              <th style={{ padding: '8px 12px', fontSize: 11, color: '#334155',
                           background: '#0d1624', borderBottom: '1px solid #1a2540',
                           whiteSpace: 'nowrap' }}>± Std</th>
              <TH label="Best"                   col="rank"    />
              <TH label="Scored"                 col="nscored" />
              {showRuns && Array.from({ length: maxRuns }, (_, i) => (
                <th key={i} style={{ padding: '8px 8px', fontSize: 10, color: '#1e3a5f',
                                     background: '#0d1624', borderBottom: '1px solid #1a2540',
                                     whiteSpace: 'nowrap', textAlign: 'right' }}>
                  R{i+1}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map((ag, i) => {
              const mc = scoreColor(ag.mean, meanMin, meanMax, higher_is_better);
              return (
                <tr key={ag.agent}
                    className="agent-row"
                    style={{ borderBottom: '1px solid #0a0f1a',
                             background: i % 2 === 0 ? '#0f172a' : '#0b1320' }}>
                  <td style={{ padding: '8px 12px', color: '#334155', width: 36,
                               fontVariantNumeric: 'tabular-nums', fontSize: 12 }}>
                    {ag.mean != null ? i + 1 : '—'}
                  </td>
                  <td style={{ padding: '8px 12px', fontWeight: 600, color: '#e2e8f0',
                               whiteSpace: 'nowrap' }}>
                    {ag.agent}
                    {ag.runs.some(r => r.value != null && !r.verified) && (
                      <span title="Includes self-reported (unverified) run(s)"
                            style={{ marginLeft: 6, fontSize: 11, color: '#fb923c' }}>⚠</span>
                    )}
                  </td>
                  <td style={{ padding: '8px 12px', fontWeight: 700,
                               fontVariantNumeric: 'tabular-nums', minWidth: 90,
                               background: mc?.bg, color: mc?.fg ?? '#475569' }}>
                    {fmt(ag.mean)}
                  </td>
                  <td style={{ padding: '8px 12px', color: '#334155',
                               fontVariantNumeric: 'tabular-nums', fontSize: 12 }}>
                    {ag.std != null ? `±${fmt(ag.std)}` : '—'}
                  </td>
                  <td style={{ padding: '8px 12px', color: '#64748b',
                               fontVariantNumeric: 'tabular-nums', fontSize: 12 }}>
                    {fmt(ag.best)}
                  </td>
                  <td style={{ padding: '8px 12px', color: '#334155', fontSize: 12,
                               textAlign: 'center' }}>
                    {ag.n_scored}/{ag.n_total}
                  </td>
                  {showRuns && Array.from({ length: maxRuns }, (_, ri) => {
                    const run = ag.runs[ri];
                    const c = run ? scoreColor(run.value, minV, maxV, higher_is_better) : null;
                    const label = !run ? '' :
                      run.value != null ? fmt(run.value) :
                      run.has_result ? '·' : '—';
                    return (
                      <td key={ri} style={{ padding: '8px 8px', fontVariantNumeric: 'tabular-nums',
                                 background: c?.bg, color: c?.fg ?? '#1e3a5f',
                                 fontSize: 11, textAlign: 'right', whiteSpace: 'nowrap' }}>
                        {label}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Merged leaderboard (AI agents + human teams, ranked together)
// ---------------------------------------------------------------------------
function MergedLeaderboard({ challenge }) {
  const { humans, agents, higher_is_better, metric_label } = challenge;
  const [showAll, setShowAll] = useState(false);
  const fmt = v => v == null ? '—' : Number(v).toFixed(4);

  useEffect(() => { setShowAll(false); }, [challenge.id]);

  if (!humans || humans.length === 0) {
    return (
      <div style={{ marginTop: 24, padding: '11px 14px', background: '#0d1624',
                    border: '1px dashed #1a2540', borderRadius: 8, fontSize: 12, color: '#334155' }}>
        No human leaderboard for this challenge yet. Drop a CSV{' '}
        <code style={{color:'#475569'}}>team,score</code> at{' '}
        <code style={{color:'#475569', wordBreak: 'break-all'}}>
          human_leaderboard/{challenge.challenge}_{challenge.prompt.replace(/_(guided(_?paper)?|hard)$/, '')}.csv
        </code>
      </div>
    );
  }

  const aiEntries = agents
    .filter(a => a.best != null)
    .map(a => ({ name: a.agent, score: a.best, type: 'ai' }));
  const entries = [
    ...humans.map(h => ({ name: h.team, score: h.score, type: 'human' })),
    ...aiEntries,
  ];
  entries.sort((a, b) => higher_is_better ? b.score - a.score : a.score - b.score);
  entries.forEach((e, i) => { e.rank = i + 1; });

  const vals = entries.map(e => e.score);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const bestAi = entries.find(e => e.type === 'ai');
  const pct = bestAi ? Math.round((1 - (bestAi.rank - 1) / (entries.length - 1)) * 100) : null;

  const FOLD = 12;
  const visible = showAll
    ? entries
    : entries.filter((e, i) => i < FOLD || e.type === 'ai');

  return (
    <div style={{ marginTop: 28 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 14, fontWeight: 700, color: '#f1f5f9' }}>Merged Leaderboard</span>
        <span style={{ fontSize: 12, color: '#334155' }}>
          {humans.length} human team{humans.length !== 1 ? 's' : ''} · AI by best run
        </span>
        {bestAi && (
          <span style={{ fontSize: 12, fontWeight: 600,
                         color: pct >= 75 ? '#4ade80' : pct >= 50 ? '#93c5fd' : '#f97316' }}>
            Best AI ({bestAi.name}) #{bestAi.rank}/{entries.length} — {pct}th pct
          </span>
        )}
      </div>
      <div style={{ overflowX: 'auto', borderRadius: 8, border: '1px solid #1a2540' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
          <thead>
            <tr>
              {['#', 'Entrant', metric_label].map((h, i) => (
                <th key={i} style={{ padding: '8px 12px', textAlign: i === 2 ? 'right' : 'left',
                             fontSize: 11, fontWeight: 600, color: '#334155',
                             background: '#0d1624', borderBottom: '1px solid #1a2540',
                             whiteSpace: 'nowrap', width: i === 0 ? 36 : undefined }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {visible.map((e, i) => {
              const isAi = e.type === 'ai';
              const c = scoreColor(e.score, minV, maxV, higher_is_better);
              return (
                <tr key={`${e.type}-${e.name}-${e.rank}`}
                    style={{ borderBottom: '1px solid #0a0f1a',
                             background: isAi ? '#0a1929' : (e.rank % 2 === 0 ? '#0f172a' : '#0b1320') }}>
                  <td style={{ padding: '7px 12px', color: '#334155', width: 36,
                               fontVariantNumeric: 'tabular-nums', fontSize: 12 }}>{e.rank}</td>
                  <td style={{ padding: '7px 12px', fontWeight: isAi ? 700 : 400,
                               color: isAi ? '#60a5fa' : '#94a3b8', whiteSpace: 'nowrap' }}>
                    <span style={{ marginRight: 6, fontSize: 11 }}>{isAi ? '🤖' : '👤'}</span>
                    {e.name}
                  </td>
                  <td style={{ padding: '7px 12px', textAlign: 'right',
                               fontWeight: isAi ? 700 : 400,
                               fontVariantNumeric: 'tabular-nums',
                               background: c?.bg, color: c?.fg ?? '#64748b' }}>
                    {fmt(e.score)}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {!showAll && humans.length > FOLD && (
        <button
          onClick={() => setShowAll(true)}
          style={{ marginTop: 7, background: 'none', border: 'none', color: '#334155',
                   fontSize: 12, cursor: 'pointer', padding: '3px 0' }}
        >
          Show all {humans.length} human teams ↓
        </button>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Main view
// ---------------------------------------------------------------------------
function MainView({ allChallenges, selectedId, onSelect }) {
  const challenge = allChallenges.find(c => c.id === selectedId);

  if (!challenge) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
                  height: '100%', color: '#1e3a5f', fontSize: 14 }}>
      Select a challenge from the sidebar
    </div>
  );

  const siblings = allChallenges.filter(c => c.challenge === challenge.challenge);
  const totalRuns  = challenge.agents.reduce((s, a) => s + a.n_total, 0);
  const scoredRuns = challenge.agents.reduce((s, a) => s + a.n_scored, 0);

  return (
    <div style={{ padding: '22px 28px', overflowY: 'auto', height: '100%' }}>
      {/* Challenge header */}
      <div style={{ marginBottom: 18 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4, flexWrap: 'wrap' }}>
          <h1 style={{ fontSize: 20, fontWeight: 700, color: '#f1f5f9', letterSpacing: '-0.02em' }}>
            {challenge.challenge}
          </h1>
          <span style={{ fontSize: 13, color: '#1e3a5f' }}>·</span>
          <span style={{ fontSize: 12, color: '#334155', fontWeight: 500 }}>{challenge.platform}</span>
          {challenge.synapse_url && (
            <a href={challenge.synapse_url} target="_blank" rel="noopener noreferrer"
               style={{ fontSize: 11, color: '#3b82f6', textDecoration: 'none',
                        background: '#0d1f3c', padding: '2px 8px', borderRadius: 4,
                        border: '1px solid #1e3a5f' }}>
              {(challenge.synapse_url.match(/syn\d+/) || [])[0]} ↗
            </a>
          )}
        </div>
        <div style={{ fontSize: 12, color: '#1e3a5f', display: 'flex', gap: 16, flexWrap: 'wrap' }}>
          <span>{challenge.agents.length} agents</span>
          <span>{scoredRuns}/{totalRuns} runs scored</span>
          <span>{challenge.metric_label}</span>
        </div>
      </div>

      {/* Prompt variant tabs */}
      <PromptTabs siblings={siblings} selectedId={selectedId} onSelect={onSelect} />

      {/* Agent table */}
      <AgentTable challenge={challenge} />

      {/* Human leaderboard */}
      <MergedLeaderboard challenge={challenge} />
    </div>
  );
}

// ---------------------------------------------------------------------------
// App root
// ---------------------------------------------------------------------------
function App() {
  const [data, setData] = useState(null);
  const [loadErr, setLoadErr] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [query, setQuery] = useState('');

  useEffect(() => {
    if (window.__INLINE_DATA__) {
      setData(window.__INLINE_DATA__);
      return;
    }
    fetch('../leaderboard.json')
      .then(r => { if (!r.ok) throw new Error(`${r.status} ${r.statusText}`); return r.json(); })
      .then(d => setData(d))
      .catch(e => setLoadErr(e.message));
  }, []);

  useEffect(() => {
    if (data && !selectedId) setSelectedId(data.challenges[0]?.id ?? null);
  }, [data]);

  const grouped = useMemo(() => {
    if (!data) return new Map();
    const q = query.trim().toLowerCase();
    const map = new Map();
    for (const c of data.challenges) {
      if (q && !c.challenge.toLowerCase().includes(q) && !c.prompt.toLowerCase().includes(q)) continue;
      if (!map.has(c.challenge)) map.set(c.challenge, []);
      map.get(c.challenge).push(c);
    }
    return map;
  }, [data, query]);

  if (loadErr) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
                  height: '100vh', flexDirection: 'column', gap: 12 }}>
      <div style={{ fontSize: 15, fontWeight: 600, color: '#ef4444' }}>Could not load leaderboard.json</div>
      <div style={{ fontSize: 13, color: '#475569', maxWidth: 440, textAlign: 'center', lineHeight: 1.6 }}>
        {loadErr}
        <br/>
        Serve from the parent directory:
        <br/>
        <code style={{ color: '#94a3b8', background: '#0d1624', padding: '2px 6px',
                        borderRadius: 4, fontSize: 12 }}>
          cd HeadlessAgents && python -m http.server 8080
        </code>
        <br/>
        then open <code style={{ color: '#94a3b8', fontSize: 12 }}>localhost:8080/LiveLeaderboard/</code>
      </div>
    </div>
  );

  if (!data) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
                  height: '100vh', color: '#1e3a5f', fontSize: 14 }}>
      Loading…
    </div>
  );

  const totalAgents = [...new Set(data.challenges.flatMap(c => c.agents.map(a => a.agent)))].length;
  const totalScored = data.challenges.reduce((s, c) => s + c.agents.reduce((s2, a) => s2 + a.n_scored, 0), 0);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
      {/* Top bar */}
      <div className="topbar" style={{ background: '#0d1624', borderBottom: '1px solid #1a2540',
                    padding: '11px 20px', display: 'flex', alignItems: 'center',
                    gap: 16, flexShrink: 0 }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: '#e2e8f0', letterSpacing: '-0.01em' }}>
          HeadlessAgents Leaderboard
        </div>
        {data.self_reported_mode && (
          <span style={{ fontSize: 11, fontWeight: 600, color: '#fb923c', background: '#3a2410',
                         border: '1px solid #7c3a12', borderRadius: 4, padding: '2px 8px' }}>
            ⚠ includes self-reported / unverified scores
          </span>
        )}
        <div style={{ fontSize: 11, color: '#1e3a5f', marginLeft: 4 }}>
          {data.generated_at}
        </div>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 18, fontSize: 11, color: '#1e3a5f' }}>
          <span>{data.challenges.length} combos</span>
          <span>{totalAgents} agents</span>
          <span>{totalScored} scored runs</span>
        </div>
      </div>

      {/* Content */}
      <div className="app-body" style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
        <Sidebar
          grouped={grouped}
          allChallenges={data.challenges}
          selectedId={selectedId}
          onSelect={setSelectedId}
          query={query}
          setQuery={setQuery}
        />
        <div className="main-content" style={{ overflow: 'hidden' }}>
          <MainView
            allChallenges={data.challenges}
            selectedId={selectedId}
            onSelect={setSelectedId}
          />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
